<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Splash 定制</title>
<style>
  :root {
    --bg: #0e1016; --panel: #161922; --line: #262a36; --text: #e6e8ef; --muted: #8b91a3; --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 90px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  section { border-top: 1px solid var(--line); padding: 14px 0; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; }
  label { display: block; margin: 8px 0 4px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row output { min-width: 52px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=text], select, textarea { width: 100%; background: #0f1118; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { height: 150px; font: 12px/1.5 Consolas, "Cascadia Code", monospace; resize: vertical; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches input { width: 38px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  button { background: #222634; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3a4054; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .link { background: none; border: 0; padding: 0; color: #9d8bff; cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .actions { position: sticky; bottom: -90px; margin: 0 -18px; padding: 12px 18px; background: var(--panel);
    border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
  main { overflow-y: auto; padding: 18px 22px; display: grid; gap: 18px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card h3 { margin: 0 0 4px; font-size: 13px; }
  .stage { position: relative; display: grid; place-items: center; min-height: 340px; background: #000; border-radius: 8px; overflow: hidden; }
  .stage canvas { display: block; max-width: 100%; max-height: 62vh; cursor: crosshair; }
  .drop { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); border: 2px dashed #333a4c;
    border-radius: 8px; pointer-events: none; text-align: center; padding: 20px; }
  .stage.dragging .drop { border-color: var(--accent); color: var(--text); background: rgba(124, 92, 255, .08); }
  .mock { position: relative; aspect-ratio: 16 / 9.8; border-radius: 8px; overflow: hidden; background: #f3f3f3; color: #222; }
  .mock .img { position: absolute; inset: 0; background-size: cover; background-repeat: no-repeat; }
  .mock .ui { position: absolute; inset: 0; display: grid; grid-template-columns: 24% 1fr; padding-top: 4%; }
  .mock .side { padding: 4%; font-size: 11px; line-height: 2.2; }
  .mock .chat { border-radius: 10px 0 0 0; display: grid; place-items: center; font-size: 18px; }
  .mock .input { position: absolute; left: 36%; right: 8%; bottom: 5%; height: 11%; border-radius: 10px; background: #fff;
    border: 1px solid #ddd; font-size: 11px; color: #999; padding: 8px 12px; }
  pre.out { margin: 0; max-height: 260px; overflow: auto; background: #0f1118; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; font: 12px/1.5 Consolas, monospace; color: #b9c0d4; white-space: pre-wrap; word-break: break-all; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222634; border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
    .actions { position: static; margin: 0; padding: 12px 0 0; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Codex Splash 定制</h1>
    <p class="sub">换图、点选脸部、调颜色，然后导出 config.json。</p>

    <section>
      <h2>图片</h2>
      <div class="row">
        <button id="pick">选择图片…</button>
        <button id="importCfg">导入 config.json</button>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
      <input id="cfgFile" type="file" accept=".json,application/json" hidden>
      <label for="imagePath">图片在项目里的路径</label>
      <input id="imagePath" type="text" value="assets/character.png">
      <p class="hint">导出后要把这张图复制到这个路径（相对项目根目录）。</p>
    </section>

    <section>
      <h2>脸部网格</h2>
      <p class="hint" style="margin-top:0">在右侧图片上点击脸的中心，彩色原图也会从这里开始显现。</p>
      <label>中心</label>
      <div class="row"><input id="meshX" type="range" min="0" max="1" step="0.005"><output id="meshXo"></output></div>
      <div class="row"><input id="meshY" type="range" min="0" max="1" step="0.005"><output id="meshYo"></output></div>
      <label for="meshR">半径（占图片宽度）</label>
      <div class="row"><input id="meshR" type="range" min="0.04" max="0.35" step="0.005"><output id="meshRo"></output></div>
    </section>

    <section>
      <h2>动画</h2>
      <label><input id="splash" type="checkbox"> 播放启动动画（关闭则只保留背景）</label>
      <label for="duration">总时长</label>
      <div class="row"><input id="duration" type="range" min="5000" max="20000" step="500"><output id="durationo"></output></div>
      <label>线稿配色 <button class="link" data-reset="palette">恢复默认</button></label>
      <div class="swatches" id="palette"></div>
      <label>光带颜色 <button class="link" data-reset="arcColors">恢复默认</button></label>
      <div class="swatches" id="arcColors"></div>
      <label for="code">打字代码（每行一句，留空用内置文本）</label>
      <textarea id="code" spellcheck="false" placeholder="// 唤醒核心 · 意识矩阵加载&#10;const seed = 'ocean://memory';&#10;await boot(seed); // neural matrix online"></textarea>
    </section>

    <section>
      <h2>主界面背景</h2>
      <label for="bgOpacity">图片不透明度</label>
      <div class="row"><input id="bgOpacity" type="range" min="0" max="1" step="0.05"><output id="bgOpacityo"></output></div>
      <label for="surfaceAlpha">聊天区底色（越高文字越清楚）</label>
      <div class="row"><input id="surfaceAlpha" type="range" min="0" max="1" step="0.05"><output id="surfaceAlphao"></output></div>
      <label for="bgPosition">图片位置</label>
      <select id="bgPosition">
        <option value="center 25%">居中偏上（适合人像）</option>
        <option value="center center">居中</option>
        <option value="right center">靠右</option>
        <option value="left center">靠左</option>
        <option value="center top">顶部</option>
      </select>
    </section>

    <div class="actions">
      <button class="primary" id="play">▶ 播放预览</button>
      <button id="download">下载 config.json</button>
      <button id="copy">复制</button>
    </div>
  </aside>

  <main>
    <div class="card">
      <h3>点击脸部中心</h3>
      <p class="hint" style="margin:0 0 10px">把图片拖到这里也可以换图。</p>
      <div class="stage" id="stage">
        <canvas id="view" width="10" height="10"></canvas>
        <div class="drop" id="drop">把图片拖到这里，或点左侧「选择图片…」</div>
      </div>
    </div>
    <div class="card">
      <h3>背景效果（示意）</h3>
      <p class="hint" style="margin:0 0 10px">模拟 Codex 浅色主题下的主界面。</p>
      <div class="mock" id="mock">
        <div class="img" id="mockImg"></div>
        <div class="ui">
          <div class="side" id="mockSide">Codex<br>新聊天<br>项目<br>codex视频生成<br>副业<br>最近</div>
          <div class="chat" id="mockChat">我们应该做些什么？</div>
        </div>
        <div class="input">随心输入</div>
      </div>
    </div>
    <div class="card">
      <h3>config.json</h3>
      <p class="hint" style="margin:0 0 10px">覆盖项目根目录的 config.json，再用桌面快捷方式启动 Codex。</p>
      <pre class="out" id="out"></pre>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const DEFAULTS = {
  imagePath: 'assets/character.png',
  splash: true,
  duration: 11000,
  meshCenter: [0.55, 0.3],
  meshRadius: 0.13,
  palette: ['#7c5cff', '#38e1ff', '#ff5fc8', '#cde8ff', '#966eff'],
  arcColors: ['#78e6ff', '#aa82ff', '#ebf5ff', '#ff78d2', '#6effdc'],
  code: null,
  bgOpacity: 0.4,
  bgPosition: 'center 25%',
  surfaceAlpha: 0.6,
  debugPort: 9229,
};
let cfg = structuredClone(DEFAULTS);
let imgURL = '';
let img = null;

const $ = (id) => document.getElementById(id);
const view = $('view'), vctx = view.getContext('2d');

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- form <-> cfg ----------
const fmt = {
  meshX: (v) => v.toFixed(3), meshY: (v) => v.toFixed(3), meshR: (v) => v.toFixed(3),
  duration: (v) => (v / 1000).toFixed(1) + ' 秒', bgOpacity: (v) => v.toFixed(2), surfaceAlpha: (v) => v.toFixed(2),
};
function swatches(key) {
  const box = $(key);
  box.innerHTML = '';
  cfg[key].forEach((c, i) => {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = c; inp.title = c;
    inp.addEventListener('input', () => { cfg[key][i] = inp.value; inp.title = inp.value; render(); });
    box.appendChild(inp);
  });
}
function fillForm() {
  $('imagePath').value = cfg.imagePath;
  $('meshX').value = cfg.meshCenter[0];
  $('meshY').value = cfg.meshCenter[1];
  $('meshR').value = cfg.meshRadius;
  $('splash').checked = cfg.splash !== false;
  $('duration').value = cfg.duration;
  $('bgOpacity').value = cfg.bgOpacity;
  $('surfaceAlpha').value = cfg.surfaceAlpha;
  const sel = $('bgPosition');
  if (![...sel.options].some((o) => o.value === cfg.bgPosition)) sel.add(new Option(cfg.bgPosition, cfg.bgPosition));
  sel.value = cfg.bgPosition;
  $('code').value = Array.isArray(cfg.code) ? cfg.code.join('\n') : '';
  swatches('palette'); swatches('arcColors');
  render();
}
function readForm() {
  cfg.imagePath = $('imagePath').value.trim() || DEFAULTS.imagePath;
  cfg.meshCenter = [+$('meshX').value, +$('meshY').value];
  cfg.meshRadius = +$('meshR').value;
  cfg.splash = $('splash').checked;
  cfg.duration = +$('duration').value;
  cfg.bgOpacity = +$('bgOpacity').value;
  cfg.surfaceAlpha = +$('surfaceAlpha').value;
  cfg.bgPosition = $('bgPosition').value;
  const lines = $('code').value.split(/\r?\n/).map((l) => l.replace(/\s+$/, '')).filter((l) => l.trim());
  cfg.code = lines.length ? lines : null;
}
document.querySelectorAll('aside input, aside select, aside textarea').forEach((el) => {
  if (el.type === 'color' || el.type === 'file') return;
  el.addEventListener('input', () => { readForm(); render(); });
});
document.querySelectorAll('[data-reset]').forEach((b) => b.addEventListener('click', () => {
  const key = b.dataset.reset; cfg[key] = [...DEFAULTS[key]]; swatches(key); render();
}));

// ---------- rendering ----------
function render() {
  for (const k in fmt) $(k + 'o').textContent = fmt[k](+$(k).value);
  drawView();
  const mi = $('mockImg');
  mi.style.backgroundImage = imgURL ? `url("${imgURL}")` : 'none';
  mi.style.backgroundPosition = cfg.bgPosition;
  mi.style.opacity = cfg.bgOpacity;
  $('mockChat').style.background = `rgba(255,255,255,${cfg.surfaceAlpha})`;
  $('mockSide').style.background = `rgba(255,255,255,${Math.min(1, cfg.surfaceAlpha + 0.22)})`;
  $('out').textContent = JSON.stringify(cfg, null, 2);
}

function drawView() {
  if (!img) { view.width = 10; view.height = 10; return; }
  const maxW = 1400;
  const s = Math.min(1, maxW / img.naturalWidth);
  view.width = Math.round(img.naturalWidth * s);
  view.height = Math.round(img.naturalHeight * s);
  const w = view.width, h = view.height;
  vctx.drawImage(img, 0, 0, w, h);
  vctx.fillStyle = 'rgba(0,0,0,.35)'; vctx.fillRect(0, 0, w, h);
  // same lattice shape as splash.js: rx = r * width, ry = 1.25 * r * width
  const [cx, cy] = cfg.meshCenter, r = cfg.meshRadius;
  const px = cx * w, py = cy * h, rx = r * w, ry = 1.25 * r * w;
  const step = rx / 5, rowH = step * 0.866;
  const pts = new Map();
  for (let row = -12; row <= 12; row++) for (let col = -12; col <= 12; col++) {
    const fx = col * step + (row & 1 ? step / 2 : 0), fy = row * rowH;
    if ((fx / rx) ** 2 + (fy / ry) ** 2 > 1) continue;
    pts.set(row + ',' + col, [px + fx, py + fy]);
  }
  vctx.strokeStyle = 'rgba(150,220,255,.55)'; vctx.lineWidth = 1;
  vctx.beginPath();
  for (const [key, p] of pts) {
    const [row, col] = key.split(',').map(Number), odd = row & 1;
    for (const n of [[row, col + 1], [row + 1, col - 1 + odd], [row + 1, col + odd]]) {
      const q = pts.get(n[0] + ',' + n[1]);
      if (q) { vctx.moveTo(p[0], p[1]); vctx.lineTo(q[0], q[1]); }
    }
  }
  vctx.stroke();
  vctx.strokeStyle = '#ff5fc8'; vctx.lineWidth = 2;
  vctx.beginPath(); vctx.ellipse(px, py, rx, ry, 0, 0, Math.PI * 2); vctx.stroke();
  vctx.fillStyle = '#fff';
  vctx.beginPath(); vctx.arc(px, py, 4, 0, Math.PI * 2); vctx.fill();
}

view.addEventListener('click', (e) => {
  if (!img) return;
  const r = view.getBoundingClientRect();
  cfg.meshCenter = [+((e.clientX - r.left) / r.width).toFixed(3), +((e.clientY - r.top) / r.height).toFixed(3)];
  $('meshX').value = cfg.meshCenter[0]; $('meshY').value = cfg.meshCenter[1];
  render();
});
view.addEventListener('wheel', (e) => {
  if (!img) return;
  e.preventDefault();
  cfg.meshRadius = Math.min(0.35, Math.max(0.04, +(cfg.meshRadius - Math.sign(e.deltaY) * 0.005).toFixed(3)));
  $('meshR').value = cfg.meshRadius; render();
}, { passive: false });

// ---------- loading ----------
function loadImage(url, name) {
  const im = new Image();
  im.onload = () => {
    img = im; imgURL = url;
    $('drop').style.display = 'none';
    if (name) { cfg.imagePath = 'assets/' + name; $('imagePath').value = cfg.imagePath; }
    render();
  };
  im.onerror = () => toast('图片读取失败');
  im.src = url;
}
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return toast('请选择图片文件');
  const fr = new FileReader();
  fr.onload = () => loadImage(fr.result, file.name);
  fr.readAsDataURL(file);
}
$('pick').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => loadFile(e.target.files[0]));
const stage = $('stage');
stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('dragging'); });
stage.addEventListener('dragleave', () => stage.classList.remove('dragging'));
stage.addEventListener('drop', (e) => { e.preventDefault(); stage.classList.remove('dragging'); loadFile(e.dataTransfer.files[0]); });

function applyConfig(obj) {
  cfg = Object.assign(structuredClone(DEFAULTS), obj);
  for (const k of ['palette', 'arcColors']) if (!Array.isArray(cfg[k]) || !cfg[k].length) cfg[k] = [...DEFAULTS[k]];
  fillForm();
}
$('importCfg').addEventListener('click', () => $('cfgFile').click());
$('cfgFile').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then((t) => { applyConfig(JSON.parse(t)); toast('已导入；如需看图请再选择对应图片'); })
    .catch(() => toast('config.json 格式不对'));
});

// ---------- output ----------
$('download').addEventListener('click', () => {
  readForm();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2) + '\n'], { type: 'application/json' }));
  a.download = 'config.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('copy').addEventListener('click', () => {
  readForm();
  navigator.clipboard.writeText(JSON.stringify(cfg, null, 2)).then(() => toast('已复制'), () => toast('复制失败，请手动选中下方文本'));
});

// ---------- splash preview ----------
$('play').addEventListener('click', () => {
  if (!img) return toast('先选择一张图片');
  readForm();
  if (window.__codexSplashStop) window.__codexSplashStop();
  window.__CODEX_SPLASH__ = {
    img: imgURL, duration: cfg.duration, meshCenter: cfg.meshCenter, meshRadius: cfg.meshRadius,
    code: cfg.code, palette: cfg.palette, arcColors: cfg.arcColors,
  };
  const s = document.createElement('script');
  s.src = 'src/splash.js?' + Date.now();
  s.onload = () => s.remove();
  s.onerror = () => toast('找不到 src/splash.js，请从项目目录打开本页');
  document.body.appendChild(s);
});

// ---------- start ----------
fillForm();
if (location.protocol.startsWith('http')) {
  // Served from the project: start from the current config and image.
  fetch('config.json').then((r) => r.ok ? r.json() : null).then((c) => {
    if (c) applyConfig(c);
    loadImage(cfg.imagePath);
  }).catch(() => {});
}
</script>
</body>
</html>
